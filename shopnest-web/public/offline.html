<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1a0f0a">
<title>ShopNest - offline</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:grid;place-items:center;padding:24px;background:#1a0f0a;color:#f3e3d0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center}
  .box{max-width:360px}
  .mark{width:72px;height:72px;margin:0 auto 22px;border-radius:18px;background:#d9a47c;color:#1a0f0a;display:grid;place-items:center;font:700 2.6rem Georgia,"Times New Roman",serif}
  h1{font-family:Georgia,"Times New Roman",serif;font-weight:600;font-size:1.9rem;margin-bottom:12px}
  p{color:#cdbfb0;line-height:1.55;margin-bottom:26px}
  button{min-height:48px;padding:0 28px;border:0;border-radius:999px;background:#d9a47c;color:#1a0f0a;font:600 1rem system-ui,sans-serif;cursor:pointer}
  [lang-sw]{display:none}
  body.sw [lang-sw]{display:block}
  body.sw [lang-en]{display:none}
</style>
</head>
<body>
<div class="box">
  <div class="mark">S</div>
  <div lang-en>
    <h1>You are offline</h1>
    <p>ShopNest needs the internet to show real prices and products. Check your connection and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </div>
  <div lang-sw>
    <h1>Hauko mtandaoni</h1>
    <p>ShopNest inahitaji mtandao ili kuonyesha bei na bidhaa halisi. Angalia muunganisho wako kisha jaribu tena.</p>
    <button type="button" onclick="location.reload()">Jaribu tena</button>
  </div>
</div>
<script>
  try { if (localStorage.getItem("shopnest_lang") === "SW") document.body.className = "sw"; } catch (e) {}
  window.addEventListener("online", function () { location.reload(); });
</script>
</body>
</html>
